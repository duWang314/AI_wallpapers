<!DOCTYPE html>
<html>
<head>
    <style>
        /* 全屏画布 */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: radial-gradient(circle, #0f0f1a 0%, #000000 100%);
        }

        /* 粒子容器 */
        #particles {
            position: absolute;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 彩虹光束 */
        .rainbow {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #ff00cc, #3333ff, #00ffcc);
            opacity: 0.3;
            animation: moveRainbow 5s linear infinite;
        }

        @keyframes moveRainbow {
            0% {transform: translateX(-100%);}
            100% {transform: translateX(100%);}
        }

        /* 鼠标点击涟漪效果 */
        .ripple {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            animation: rippleAnim 1s ease-out;
        }

        @keyframes rippleAnim {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(10);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <script>
        // 粒子系统初始化
        const particlesContainer = document.getElementById('particles');
        const particleCount = 100;
        const particles = [];
        const mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };

        // 创建粒子元素
        for(let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.position = 'absolute';
            particle.style.width = particle.style.height = 
                `${Math.random() * 4 + 2}px`;
            particle.style.background = 
                `hsla(${Math.random() * 360}, 100%, 70%, 0.8)`;
            particle.x = Math.random() * window.innerWidth;
            particle.y = Math.random() * window.innerHeight;
            particle.vx = (Math.random() - 0.5) * 0.5;
            particle.vy = (Math.random() - 0.5) * 0.5;
            particlesContainer.appendChild(particle);
            particles.push(particle);
        }

        // 创建彩虹光束
        for(let i = 0; i < 3; i++) {
            const beam = document.createElement('div');
            beam.className = 'rainbow';
            beam.style.top = `${Math.random() * 100}%`;
            beam.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(beam);
        }

        // 动画更新
        function animate() {
            for(const particle of particles) {
                particle.x += particle.vx;
                particle.y += particle.vy;
                
                // 边界反弹
                if(particle.x < 0 || particle.x > window.innerWidth) {
                    particle.vx *= -1;
                }
                if(particle.y < 0 || particle.y > window.innerHeight) {
                    particle.vy *= -1;
                }

                // 鼠标吸引
                const dx = mouse.x - particle.x;
                const dy = mouse.y - particle.y;
                particle.vx += dx * 0.00005;
                particle.vy += dy * 0.00005;

                // 限制速度
                if(particle.vx > 0.5) particle.vx = 0.5;
                if(particle.vy > 0.5) particle.vy = 0.5;

                // 更新位置
                particle.style.transform = `translate(${particle.x}px, ${particle.y}px)`;
            }
            requestAnimationFrame(animate);
        }

        // 鼠标移动事件
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // 点击涟漪效果
        window.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = `${e.clientX}px`;
            ripple.style.top = `${e.clientY}px`;
            particlesContainer.appendChild(ripple);
            
            ripple.addEventListener('animationend', () => {
                ripple.remove();
            });
        });

        // 窗口调整处理
        window.addEventListener('resize', () => {
            for(const particle of particles) {
                particle.x = Math.random() * window.innerWidth;
                particle.y = Math.random() * window.innerHeight;
            }
        });

        // 启动动画
        animate();
    </script>
</body>
</html>
