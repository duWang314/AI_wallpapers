<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷互动桌面壁纸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wallpaper-container">
        <!-- 背景粒子效果 -->
        <canvas id="particleCanvas"></canvas>
        
        <!-- 中央互动元素 -->
        <div class="central-orb">
            <div class="orb-core"></div>
            <div class="orb-rings">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
            </div>
        </div>
        
        <!-- 浮动信息面板 -->
        <div class="info-panel">
            <div class="time-display">
                <span id="current-time">00:00:00</span>
            </div>
            <div class="date-display">
                <span id="current-date">2024年1月1日</span>
            </div>
        </div>
        
        <!-- 交互按钮 -->
        <div class="control-panel">
            <button class="control-btn" id="theme-toggle">切换主题</button>
            <button class="control-btn" id="particle-toggle">粒子效果</button>
            <button class="control-btn" id="audio-toggle">背景音乐</button>
        </div>
        
        <!-- 音频元素 -->
        <audio id="bg-music" loop>
            <source src="#" type="audio/mpeg">
        </audio>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
