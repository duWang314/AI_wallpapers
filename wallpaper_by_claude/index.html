<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动式动态壁纸</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            display: flex;
            gap: 15px;
        }
        
        button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
        
        .time {
            position: absolute;
            top: 20px;
            font-size: 3em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }
        
        .date {
            position: absolute;
            top: 80px;
            font-size: 1.2em;
            opacity: 0.8;
            z-index: 2;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="time">00:00:00</div>
    <div class="date">星期一, 一月 1日</div>
    
    <div class="controls">
        <button id="particleBtn">粒子效果</button>
        <button id="waveBtn">波浪效果</button>
        <button id="colorBtn">更换颜色</button>
        <button id="speedBtn">调整速度</button>
    </div>
    
    <div class="tooltip">提示信息</div>
    
    <script>
        // 设置画布
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 初始设置
        let particles = [];
        let wave = true;
        let particleMode = false;
        let colorScheme = 0;
        const colorSchemes = [
            {bg: ['#0f2027', '#203a43', '#2c5364'], particle: '#ffffff'},
            {bg: ['#8e2de2', '#4a00e0'], particle: '#fff200'},
            {bg: ['#ff416c', '#ff4b2b'], particle: '#00ffff'},
            {bg: ['#11998e', '#38ef7d'], particle: '#ff00ff'},
            {bg: ['#0f0c29', '#302b63', '#24243e'], particle: '#ff9900'}
        ];
        let speed = 1;
        
        // 创建粒子
        function createParticles() {
            particles = [];
            const numberOfParticles = Math.floor(window.innerWidth * window.innerHeight / 15000);
            
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 5 + 1,
                    speedX: (Math.random() - 0.5) * 2 * speed,
                    speedY: (Math.random() - 0.5) * 2 * speed,
                    color: colorSchemes[colorScheme].particle
                });
            }
        }
        
        // 更新粒子
        function updateParticles() {
            for (let i = 0; i < particles.length; i++) {
                particles[i].x += particles[i].speedX;
                particles[i].y += particles[i].speedY;
                
                // 边界检查
                if (particles[i].x < 0 || particles[i].x > canvas.width) {
                    particles[i].speedX *= -1;
                }
                if (particles[i].y < 0 || particles[i].y > canvas.height) {
                    particles[i].speedY *= -1;
                }
            }
        }
        
        // 绘制粒子
        function drawParticles() {
            for (let i = 0; i < particles.length; i++) {
                ctx.fillStyle = particles[i].color;
                ctx.beginPath();
                ctx.arc(particles[i].x, particles[i].y, particles[i].size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 绘制连接线
        function drawConnections() {
            const maxDistance = 150;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < maxDistance) {
                        ctx.strokeStyle = `rgba(255, 255, 255, ${1 - distance / maxDistance})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }
        
        // 绘制波浪
        function drawWave(timestamp) {
            const numberOfWaves = 3;
            const waveHeight = canvas.height * 0.2;
            const waveWidth = canvas.width;
            
            for (let w = 0; w < numberOfWaves; w++) {
                ctx.beginPath();
                ctx.moveTo(0, canvas.height * 0.5);
                
                for (let i = 0; i < waveWidth; i++) {
                    const x = i;
                    const frequency = 0.003 - (w * 0.001);
                    const waveSpeed = timestamp * 0.05 * speed * (w + 1) * 0.2;
                    const y = Math.sin(x * frequency + waveSpeed) * waveHeight + canvas.height * 0.5;
                    
                    ctx.lineTo(x, y);
                }
                
                ctx.lineTo(waveWidth, canvas.height);
                ctx.lineTo(0, canvas.height);
                ctx.closePath();
                
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
                const colors = colorSchemes[colorScheme].bg;
                
                colors.forEach((color, index) => {
                    gradient.addColorStop(index / (colors.length - 1), color);
                });
                
                ctx.fillStyle = gradient;
                ctx.globalAlpha = 0.2 - (w * 0.05);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        // 动画循环
        function animate(timestamp) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            const colors = colorSchemes[colorScheme].bg;
            
            colors.forEach((color, index) => {
                gradient.addColorStop(index / (colors.length - 1), color);
            });
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制效果
            if (wave) {
                drawWave(timestamp);
            }
            
            if (particleMode) {
                updateParticles();
                drawParticles();
                drawConnections();
            }
            
            requestAnimationFrame(animate);
        }
        
        // 更新时间
        function updateTime() {
            const now = new Date();
            const timeElement = document.querySelector('.time');
            const dateElement = document.querySelector('.date');
            
            // 格式化时间
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeElement.textContent = `${hours}:${minutes}:${seconds}`;
            
            // 格式化日期
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            const weekday = weekdays[now.getDay()];
            const month = months[now.getMonth()];
            const date = now.getDate();
            dateElement.textContent = `${month}${date}日 ${weekday}`;
        }
        
        // 交互功能
        const particleBtn = document.getElementById('particleBtn');
        const waveBtn = document.getElementById('waveBtn');
        const colorBtn = document.getElementById('colorBtn');
        const speedBtn = document.getElementById('speedBtn');
        const tooltip = document.querySelector('.tooltip');
        
        // 添加工具提示功能
        function showTooltip(element, text) {
            element.addEventListener('mouseover', (e) => {
                tooltip.textContent = text;
                tooltip.style.opacity = '1';
                tooltip.style.left = `${e.pageX + 10}px`;
                tooltip.style.top = `${e.pageY + 10}px`;
            });
            
            element.addEventListener('mousemove', (e) => {
                tooltip.style.left = `${e.pageX + 10}px`;
                tooltip.style.top = `${e.pageY + 10}px`;
            });
            
            element.addEventListener('mouseout', () => {
                tooltip.style.opacity = '0';
            });
        }
        
        // 添加各按钮的功能
        particleBtn.addEventListener('click', () => {
            particleMode = !particleMode;
            if (particleMode && particles.length === 0) {
                createParticles();
            }
            particleBtn.textContent = particleMode ? '关闭粒子' : '粒子效果';
        });
        
        waveBtn.addEventListener('click', () => {
            wave = !wave;
            waveBtn.textContent = wave ? '关闭波浪' : '波浪效果';
        });
        
        colorBtn.addEventListener('click', () => {
            colorScheme = (colorScheme + 1) % colorSchemes.length;
            document.body.style.background = `linear-gradient(135deg, ${colorSchemes[colorScheme].bg.join(', ')})`;
        });
        
        speedBtn.addEventListener('click', () => {
            speed = speed >= 2 ? 0.5 : speed + 0.5;
            speedBtn.textContent = `速度: ${speed}x`;
        });
        
        // 添加工具提示
        showTooltip(particleBtn, '开启/关闭浮动粒子效果');
        showTooltip(waveBtn, '开启/关闭波浪动画效果');
        showTooltip(colorBtn, '切换壁纸颜色主题');
        showTooltip(speedBtn, '调整动画速度');
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            createParticles();
        });
        
        // 鼠标交互
        canvas.addEventListener('mousemove', (e) => {
            if (particleMode) {
                // 添加鼠标吸引效果
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                const influenceRadius = 100;
                
                for (let i = 0; i < particles.length; i++) {
                    const dx = mouseX - particles[i].x;
                    const dy = mouseY - particles[i].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < influenceRadius) {
                        particles[i].x += dx * 0.01;
                        particles[i].y += dy * 0.01;
                    }
                }
            }
        });
        
        canvas.addEventListener('click', () => {
            if (particleMode) {
                // 点击时产生爆炸效果
                const explosionX = event.clientX;
                const explosionY = event.clientY;
                
                for (let i = 0; i < particles.length; i++) {
                    const dx = explosionX - particles[i].x;
                    const dy = explosionY - particles[i].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 150) {
                        const angle = Math.atan2(dy, dx);
                        const force = (150 - distance) / 10;
                        particles[i].speedX -= Math.cos(angle) * force;
                        particles[i].speedY -= Math.sin(angle) * force;
                    }
                }
            }
        });
        
        // 启动
        createParticles();
        setInterval(updateTime, 1000);
        updateTime();
        animate();
    </script>
</body>
</html>
