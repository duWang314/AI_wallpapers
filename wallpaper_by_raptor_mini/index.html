<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>互动炫酷桌面壁纸 — AI Wall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="bg"></canvas>

    <div id="hud">
      <div class="left">
        <div class="clock" id="clock"></div>
        <div class="date" id="date"></div>
      </div>

      <div class="center">
        <div id="info">点击任意位置生成脉冲，移动鼠标产生视差</div>
      </div>

      <div class="right">
        <div class="controls">
          <label>主题
            <select id="themeSelect">
              <option value="neon">Neon</option>
              <option value="synth">Synthwave</option>
              <option value="space">Starlight</option>
              <option value="calm">Calm</option>
            </select>
          </label>
          <label>粒子
            <input type="range" id="particleCount" min="10" max="400" value="140">
          </label>
          <label>速度
            <input type="range" id="speed" min="0" max="2" step="0.1" value="1">
          </label>
          <button id="toggleBlur">模糊: 关</button>
        </div>
      </div>
    </div>

    <div id="watermark">AI Wall • 交互壁纸</div>
  </div>

  <script src="script.js" type="module"></script>
</body>
</html>
