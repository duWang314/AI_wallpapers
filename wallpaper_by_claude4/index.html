<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Interactive Wallpaper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wallpaper-container">
        <!-- Animated background layers -->
        <div class="space-bg"></div>
        
        <!-- Particle system canvas -->
        <canvas id="particleCanvas"></canvas>
        
        <!-- Interactive elements -->
        <div class="cosmic-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
        
        <!-- Floating geometric shapes -->
        <div class="geometric-shapes">
            <div class="shape triangle"></div>
            <div class="shape hexagon"></div>
            <div class="shape circle"></div>
            <div class="shape diamond"></div>
        </div>
        
        <!-- Nebula effects -->
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="nebula nebula-3"></div>
        
        <!-- Interactive constellation -->
        <div class="constellation">
            <div class="star" data-constellation="1"></div>
            <div class="star" data-constellation="1"></div>
            <div class="star" data-constellation="1"></div>
            <div class="star" data-constellation="2"></div>
            <div class="star" data-constellation="2"></div>
            <div class="star" data-constellation="2"></div>
            <div class="star" data-constellation="3"></div>
            <div class="star" data-constellation="3"></div>
        </div>
        
        <!-- Digital time display -->
        <div class="time-display">
            <div class="time" id="currentTime">00:00:00</div>
            <div class="date" id="currentDate">2025年5月23日</div>
        </div>
        
        <!-- Audio visualizer -->
        <div class="audio-visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        
        <!-- Interactive controls -->
        <div class="controls">
            <button class="control-btn" id="themeToggle">🌙</button>
            <button class="control-btn" id="particleToggle">✨</button>
            <button class="control-btn" id="musicToggle">🎵</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
