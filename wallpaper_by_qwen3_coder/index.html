<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Desktop Wallpaper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wallpaper-container">
        <canvas id="particleCanvas"></canvas>
        
        <div class="content">
            <div class="time-display">
                <div id="time"></div>
                <div id="date"></div>
            </div>
            
            <div class="greeting">
                <h1 id="greetingText">Good Evening</h1>
            </div>
            
            <div class="interactive-elements">
                <div class="element" id="element1"></div>
                <div class="element" id="element2"></div>
                <div class="element" id="element3"></div>
            </div>
        </div>
        
        <div class="customizer">
            <button id="themeToggle">Toggle Theme</button>
            <button id="particlesToggle">Toggle Particles</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
