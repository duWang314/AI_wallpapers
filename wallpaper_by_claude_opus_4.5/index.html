<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Neon Wallpaper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="ui"> 
    <h1>Neon Desktop</h1>
    <div class="controls">
      <label>Particles: <input id="count" type="range" min="50" max="1200" value="320"></label>
      <label>Size: <input id="size" type="range" min="0.5" max="6" step="0.1" value="2"></label>
      <label>Glow Color: <input id="color" type="color" value="#00d1ff"></label>
      <label><input id="motion" type="checkbox" checked> Motion Blur</label>
    </div>
    <div class="actions">
      <button id="theme">Toggle Theme</button>
      <button id="fullscreen">Fullscreen</button>
      <button id="reset">Reset</button>
    </div>
    <p class="hint">Move mouse to interact — hold left-click to attract particles.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
