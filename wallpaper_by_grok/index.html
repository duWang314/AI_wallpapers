<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷星空壁纸</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="starryNight"></canvas>
    <script>
        const canvas = document.getElementById('starryNight');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 星星类
        class Star {
            constructor(x, y, radius, alpha) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.alpha = alpha;
                this.twinkleSpeed = Math.random() * 0.02 + 0.01; // 闪烁速度
                this.dx = (Math.random() - 0.5) * 0.1; // 水平速度
                this.dy = (Math.random() - 0.5) * 0.1; // 垂直速度
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }

            update() {
                this.x += this.dx;
                this.y += this.dy;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
                this.alpha += this.twinkleSpeed;
                if (this.alpha > 1 || this.alpha < 0) {
                    this.twinkleSpeed = -this.twinkleSpeed;
                }
                this.draw();
            }
        }

        // 初始化星星
        const stars = [];
        const numStars = 200;
        for (let i = 0; i < numStars; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const radius = Math.random() * 2 + 1;
            const alpha = Math.random();
            stars.push(new Star(x, y, radius, alpha));
        }

        // 鼠标位置和拖尾
        let mouse = { x: 0, y: 0 };
        const trail = [];
        const trailLength = 20;

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
            trail.push({ x: mouse.x, y: mouse.y });
            if (trail.length > trailLength) {
                trail.shift();
            }
        });

        // 点击生成新星星
        window.addEventListener('click', (event) => {
            const x = event.clientX;
            const y = event.clientY;
            const radius = Math.random() * 2 + 1;
            const alpha = Math.random();
            stars.push(new Star(x, y, radius, alpha));
        });

        // 键盘控制背景颜色
        window.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'r':
                    document.body.style.backgroundColor = 'red';
                    break;
                case 'b':
                    document.body.style.backgroundColor = 'blue';
                    break;
                case 'g':
                    document.body.style.backgroundColor = 'green';
                    break;
                default:
                    document.body.style.backgroundColor = 'black';
            }
        });

        // 自适应窗口大小
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 绘制拖尾效果
        function drawTrail() {
            trail.forEach((point, index) => {
                const alpha = (index + 1) / trailLength;
                const radius = (index + 1) / trailLength * 5;
                ctx.beginPath();
                ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
            });
        }

        // 更新星星（包括鼠标互动）
        function updateStars() {
            stars.forEach(star => {
                const dx = star.x - mouse.x;
                const dy = star.y - mouse.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 50) {
                    star.dx += dx / distance * 0.1;
                    star.dy += dy / distance * 0.1;
                }
                star.update();
            });
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updateStars();
            drawTrail();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
