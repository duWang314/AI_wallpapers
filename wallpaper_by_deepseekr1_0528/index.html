<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷交互式动态壁纸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            position: relative;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .title {
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff8a00, #e52e71, #22c1c3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleGlow 2s infinite alternate;
        }
        
        @keyframes titleGlow {
            0% { text-shadow: 0 0 10px rgba(255, 138, 0, 0.7); }
            50% { text-shadow: 0 0 20px rgba(229, 46, 113, 0.8); }
            100% { text-shadow: 0 0 15px rgba(34, 193, 195, 0.9); }
        }
        
        .theme-switcher {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 10px 20px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .theme-switcher:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .time-display {
            text-align: center;
            font-size: 5rem;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            letter-spacing: 3px;
            margin-top: -100px;
        }
        
        .date-display {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 300;
            opacity: 0.8;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        
        .footer {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .footer-item {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            padding: 15px 30px;
            min-width: 150px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .footer-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .footer-title {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 8px;
        }
        
        .footer-value {
            font-size: 1.4rem;
            font-weight: 500;
        }
        
        .particle-count {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .instructions {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            background: rgba(255, 255, 255, 0.4);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
        }
        
        @keyframes rippleEffect {
            to {
                transform: scale(3);
                opacity: 0;
            }
        }
        
        .floating {
            position: absolute;
            z-index: 5;
            opacity: 0.3;
        }
        
        .floating.circle1 {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff8a00, #e52e71);
            top: 15%;
            left: 10%;
            animation: float 12s ease-in-out infinite;
        }
        
        .floating.circle2 {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #22c1c3, #1a2a6c);
            bottom: 20%;
            right: 15%;
            animation: float 8s ease-in-out infinite;
        }
        
        .floating.circle3 {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #5433FF, #20BDFF);
            top: 40%;
            right: 20%;
            animation: float 15s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(20px, 30px) rotate(120deg); }
            66% { transform: translate(-20px, -30px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }
        
        .theme-dark {
            background: linear-gradient(135deg, #232526, #414345);
        }
        
        .theme-purple {
            background: linear-gradient(135deg, #4b1248, #f0c27b);
        }
        
        .theme-ocean {
            background: linear-gradient(135deg, #0a192f, #172a45);
        }
        
        .theme-neon {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="floating circle1"></div>
    <div class="floating circle2"></div>
    <div class="floating circle3"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">星际粒子壁纸</h1>
            <div class="theme-switcher" id="themeSwitcher">切换主题</div>
        </div>
        
        <div class="content">
            <div class="time-display" id="timeDisplay">00:00:00</div>
            <div class="date-display" id="dateDisplay">2023年1月1日 星期一</div>
        </div>
        
        <div class="footer">
            <div class="footer-item">
                <div class="footer-title">粒子数量</div>
                <div class="footer-value" id="particleCount">150</div>
            </div>
            <div class="footer-item">
                <div class="footer-title">鼠标速度</div>
                <div class="footer-value" id="mouseSpeed">0</div>
            </div>
            <div class="footer-item">
                <div class="footer-title">帧率</div>
                <div class="footer-value" id="fps">60</div>
            </div>
        </div>
    </div>
    
    <div class="particle-count">活动粒子: <span id="activeParticles">0</span></div>
    <div class="instructions">点击或移动鼠标进行交互</div>

    <script>
        // 获取DOM元素
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const timeDisplay = document.getElementById('timeDisplay');
        const dateDisplay = document.getElementById('dateDisplay');
        const themeSwitcher = document.getElementById('themeSwitcher');
        const particleCountDisplay = document.getElementById('particleCount');
        const activeParticlesDisplay = document.getElementById('activeParticles');
        const mouseSpeedDisplay = document.getElementById('mouseSpeed');
        const fpsDisplay = document.getElementById('fps');
        
        // 设置canvas尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // 粒子系统
        const particles = [];
        const particleCount = 150;
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let mouseSpeed = 0;
        let lastMouseX = mouseX;
        let lastMouseY = mouseY;
        let lastTimestamp = 0;
        let frameCount = 0;
        let currentFps = 60;
        
        // 粒子类
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.life = Math.random() * 100 + 50;
                this.maxLife = this.life;
            }
            
            update() {
                // 向鼠标方向移动
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 100) {
                    const force = (100 - distance) / 100;
                    this.speedX += dx * 0.001 * force;
                    this.speedY += dy * 0.001 * force;
                }
                
                // 应用速度
                this.x += this.speedX;
                this.y += this.speedY;
                
                // 边界检查
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                
                // 生命值减少
                this.life--;
                
                // 重置死亡粒子
                if (this.life <= 0) {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.speedX = Math.random() * 3 - 1.5;
                    this.speedY = Math.random() * 3 - 1.5;
                    this.life = Math.random() * 100 + 50;
                    this.maxLife = this.life;
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha * (this.life / this.maxLife);
                ctx.fill();
                ctx.closePath();
            }
        }
        
        // 创建粒子
        function createParticles() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
            particleCountDisplay.textContent = particleCount;
        }
        
        // 鼠标移动事件
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // 计算鼠标速度
            const now = Date.now();
            if (lastTimestamp) {
                const timeDiff = now - lastTimestamp;
                if (timeDiff > 0) {
                    const distance = Math.sqrt(
                        Math.pow(mouseX - lastMouseX, 2) + 
                        Math.pow(mouseY - lastMouseY, 2)
                    );
                    mouseSpeed = Math.round(distance / timeDiff * 1000);
                    mouseSpeedDisplay.textContent = mouseSpeed;
                }
            }
            
            lastMouseX = mouseX;
            lastMouseY = mouseY;
            lastTimestamp = now;
        });
        
        // 点击事件 - 创建波纹效果
        canvas.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.classList.add('ripple');
            ripple.style.left = `${e.clientX}px`;
            ripple.style.top = `${e.clientY}px`;
            document.body.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        });
        
        // 主题切换
        const themes = ['theme-neon', 'theme-dark', 'theme-purple', 'theme-ocean'];
        let currentThemeIndex = 0;
        
        themeSwitcher.addEventListener('click', () => {
            // 移除当前主题
            themes.forEach(theme => {
                document.body.classList.remove(theme);
            });
            
            // 设置新主题
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.body.classList.add(themes[currentThemeIndex]);
        });
        
        // 更新时间显示
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;
            
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]}`;
            dateDisplay.textContent = dateStr;
        }
        
        // 动画循环
        function animate(timestamp) {
            frameCount++;
            
            // 计算FPS
            if (timestamp >= lastTimestamp + 1000) {
                currentFps = frameCount;
                frameCount = 0;
                lastTimestamp = timestamp;
                fpsDisplay.textContent = currentFps;
            }
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制半透明背景
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制粒子之间的连线
            ctx.lineWidth = 0.1;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.2 * (1 - distance/100)})`;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            // 更新和绘制粒子
            let activeCount = 0;
            particles.forEach(particle => {
                particle.update();
                particle.draw();
                if (particle.life > 0) activeCount++;
            });
            
            activeParticlesDisplay.textContent = activeCount;
            
            requestAnimationFrame(animate);
        }
        
        // 初始化
        createParticles();
        updateTime();
        setInterval(updateTime, 1000);
        animate(0);
    </script>
</body>
</html>
