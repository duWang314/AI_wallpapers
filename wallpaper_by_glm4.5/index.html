<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷互动桌面壁纸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
            transition: all 0.5s ease;
        }

        /* 画布背景 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 主容器 */
        .desktop {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }

        /* 顶部任务栏 */
        .taskbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .taskbar:hover {
            background: rgba(0, 0, 0, 0.85);
        }

        /* 搜索栏 */
        .search-container {
            flex: 1;
            max-width: 500px;
            margin: 0 20px;
        }

        .search-box {
            width: 100%;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-box:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        /* 系统信息 */
        .system-info {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #fff;
        }

        .clock {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .weather {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .weather-icon {
            font-size: 24px;
        }

        /* 桌面图标 */
        .desktop-icons {
            position: absolute;
            top: 80px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 80px);
            gap: 20px;
            z-index: 10;
        }

        .icon {
            width: 80px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .icon:hover {
            transform: scale(1.1);
        }

        .icon.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .icon-img {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 8px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .icon:hover .icon-img {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 20px rgba(100, 200, 255, 0.5);
        }

        .icon-label {
            color: #fff;
            font-size: 12px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* 音乐播放器 */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            color: #fff;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .music-player:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(100, 200, 255, 0.3);
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .album-art {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .music-details h4 {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .music-details p {
            font-size: 12px;
            opacity: 0.7;
        }

        .music-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            transform: scale(1.2);
            color: #64b5f6;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #64b5f6, #42a5f5);
            width: 30%;
            transition: width 0.3s ease;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        /* 浅色主题 */
        body.light-theme {
            background: #f0f0f0;
        }

        body.light-theme .taskbar {
            background: rgba(255, 255, 255, 0.9);
        }

        body.light-theme .search-box {
            background: rgba(0, 0, 0, 0.1);
            color: #000;
        }

        body.light-theme .search-box::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }

        body.light-theme .system-info,
        body.light-theme .icon-label {
            color: #000;
        }

        body.light-theme .music-player {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
        }

        body.light-theme .control-btn {
            color: #000;
        }

        body.light-theme .control-btn:hover {
            color: #1976d2;
        }

        /* 右键菜单 */
        .context-menu {
            position: fixed;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px 0;
            display: none;
            z-index: 2000;
            min-width: 200px;
        }

        .context-menu-item {
            padding: 10px 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .context-menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* 动画效果 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        /* 提示信息 */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px 30px;
            border-radius: 25px;
            display: none;
            z-index: 3000;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <!-- 粒子背景画布 -->
    <canvas id="particleCanvas"></canvas>

    <!-- 桌面容器 -->
    <div class="desktop">
        <!-- 顶部任务栏 -->
        <div class="taskbar">
            <div class="system-info">
                <div class="clock" id="clock">00:00</div>
                <div class="weather">
                    <span class="weather-icon">☀️</span>
                    <span id="weather">晴天 25°C</span>
                </div>
            </div>
            <div class="search-container">
                <input type="text" class="search-box" placeholder="搜索应用、文件或网页...">
            </div>
            <div class="system-info">
                <span id="date">2024年1月1日</span>
            </div>
        </div>

        <!-- 桌面图标 -->
        <div class="desktop-icons" id="desktopIcons">
            <div class="icon" draggable="true" data-app="browser">
                <div class="icon-img">🌐</div>
                <div class="icon-label">浏览器</div>
            </div>
            <div class="icon" draggable="true" data-app="files">
                <div class="icon-img">📁</div>
                <div class="icon-label">文件管理</div>
            </div>
            <div class="icon" draggable="true" data-app="settings">
                <div class="icon-img">⚙️</div>
                <div class="icon-label">设置</div>
            </div>
            <div class="icon" draggable="true" data-app="photos">
                <div class="icon-img">🖼️</div>
                <div class="icon-label">照片</div>
            </div>
            <div class="icon" draggable="true" data-app="music">
                <div class="icon-img">🎵</div>
                <div class="icon-label">音乐</div>
            </div>
            <div class="icon" draggable="true" data-app="games">
                <div class="icon-img">🎮</div>
                <div class="icon-label">游戏</div>
            </div>
        </div>

        <!-- 音乐播放器 -->
        <div class="music-player floating">
            <div class="music-info">
                <div class="album-art"></div>
                <div class="music-details">
                    <h4>正在播放</h4>
                    <p>未知艺术家 - 未知歌曲</p>
                </div>
            </div>
            <div class="music-controls">
                <button class="control-btn" id="prevBtn">⏮️</button>
                <button class="control-btn" id="playBtn">▶️</button>
                <button class="control-btn" id="nextBtn">⏭️</button>
            </div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <!-- 主题切换按钮 -->
        <button class="theme-toggle" id="themeToggle">🌙</button>

        <!-- 右键菜单 -->
        <div class="context-menu" id="contextMenu">
            <div class="context-menu-item" data-action="refresh">
                <span>🔄</span>
                <span>刷新</span>
            </div>
            <div class="context-menu-item" data-action="new-folder">
                <span>📁</span>
                <span>新建文件夹</span>
            </div>
            <div class="context-menu-item" data-action="personalize">
                <span>🎨</span>
                <span>个性化</span>
            </div>
        </div>

        <!-- 提示信息 -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // 粒子背景效果
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouseX = 0;
        let mouseY = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.color = `hsl(${Math.random() * 60 + 200}, 70%, 50%)`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // 鼠标交互
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 100) {
                    const force = (100 - distance) / 100;
                    this.x -= dx * force * 0.03;
                    this.y -= dy * force * 0.03;
                }

                // 边界检测
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            // 连接临近粒子
            particles.forEach((particle, i) => {
                particles.slice(i + 1).forEach(otherParticle => {
                    const dx = particle.x - otherParticle.x;
                    const dy = particle.y - otherParticle.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 100) {
                        ctx.strokeStyle = `rgba(100, 200, 255, ${1 - distance / 100})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particle.x, particle.y);
                        ctx.lineTo(otherParticle.x, otherParticle.y);
                        ctx.stroke();
                    }
                });
            });

            requestAnimationFrame(animateParticles);
        }

        // 时钟更新
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[now.getDay()];

            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            document.getElementById('date').textContent = `${year}年${month}月${day}日 ${weekday}`;
        }

        // 天气模拟
        function updateWeather() {
            const weatherTypes = [
                { icon: '☀️', text: '晴天 25°C' },
                { icon: '⛅', text: '多云 22°C' },
                { icon: '🌧️', text: '雨天 18°C' },
                { icon: '❄️', text: '雪天 -2°C' }
            ];
            const randomWeather = weatherTypes[Math.floor(Math.random() * weatherTypes.length)];
            document.querySelector('.weather-icon').textContent = randomWeather.icon;
            document.getElementById('weather').textContent = randomWeather.text;
        }

        // 拖拽功能
        let draggedElement = null;

        document.querySelectorAll('.icon').forEach(icon => {
            icon.addEventListener('dragstart', (e) => {
                draggedElement = e.target.closest('.icon');
                draggedElement.classList.add('dragging');
            });

            icon.addEventListener('dragend', (e) => {
                e.target.closest('.icon').classList.remove('dragging');
            });

            icon.addEventListener('click', (e) => {
                const app = e.target.closest('.icon').dataset.app;
                showToast(`正在启动 ${e.target.closest('.icon').querySelector('.icon-label').textContent}...`);
            });
        });

        document.getElementById('desktopIcons').addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.getElementById('desktopIcons').addEventListener('drop', (e) => {
            e.preventDefault();
            if (draggedElement) {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left - 40;
                const y = e.clientY - rect.top - 50;
                
                draggedElement.style.position = 'absolute';
                draggedElement.style.left = `${x}px`;
                draggedElement.style.top = `${y}px`;
                draggedElement.style.margin = '0';
            }
        });

        // 音乐播放器控制
        let isPlaying = false;
        let progress = 30;

        document.getElementById('playBtn').addEventListener('click', () => {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').textContent = isPlaying ? '⏸️' : '▶️';
            showToast(isPlaying ? '正在播放音乐' : '音乐已暂停');
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            showToast('上一首');
            progress = 0;
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            showToast('下一首');
            progress = 0;
        });

        // 模拟进度条更新
        setInterval(() => {
            if (isPlaying && progress < 100) {
                progress += 0.5;
                document.getElementById('progress').style.width = `${progress}%`;
            }
        }, 1000);

        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        let isLightTheme = false;

        themeToggle.addEventListener('click', () => {
            isLightTheme = !isLightTheme;
            document.body.classList.toggle('light-theme');
            themeToggle.textContent = isLightTheme ? '☀️' : '🌙';
            showToast(isLightTheme ? '已切换到浅色主题' : '已切换到深色主题');
        });

        // 右键菜单
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const contextMenu = document.getElementById('contextMenu');
            contextMenu.style.display = 'block';
            contextMenu.style.left = `${e.pageX}px`;
            contextMenu.style.top = `${e.pageY}px`;
        });

        document.addEventListener('click', () => {
            document.getElementById('contextMenu').style.display = 'none';
        });

        document.querySelectorAll('.context-menu-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const action = e.currentTarget.dataset.action;
                switch(action) {
                    case 'refresh':
                        showToast('刷新桌面');
                        initParticles();
                        break;
                    case 'new-folder':
                        showToast('新建文件夹');
                        break;
                    case 'personalize':
                        showToast('打开个性化设置');
                        break;
                }
            });
        });

        // 搜索功能
        document.querySelector('.search-box').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                if (query) {
                    showToast(`搜索: ${query}`);
                    e.target.value = '';
                }
            }
        });

        // 提示信息
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // 鼠标移动追踪
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        // 初始化
        resizeCanvas();
        initParticles();
        animateParticles();
        updateClock();
        updateWeather();

        // 定时更新
        setInterval(updateClock, 1000);
        setInterval(updateWeather, 30000); // 每30秒更新一次天气

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            // Ctrl + D 深色/浅色切换
            if (e.ctrlKey && e.key === 'd') {
                e.preventDefault();
                themeToggle.click();
            }
            // Ctrl + R 刷新
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                showToast('刷新桌面');
                initParticles();
            }
        });

        // 欢迎消息
        setTimeout(() => {
            showToast('欢迎来到炫酷互动桌面！');
        }, 1000);
    </script>
</body>
</html>
