<!DOCTYPE html>
<html lang=“zh-CN”>
<head>
<meta charset=“UTF-8” />
<meta name=“viewport” content=“width=device-width, initial-scale=1.0” />
<title>互动桌面壁纸</title>
<style>
/* 重置margin、padding，并隐藏滚动条 */
body, html {
margin: 0;
padding: 0;
overflow: hidden;
background-color: #000;
}
/* 让canvas占满整个屏幕 */
canvas {
display: block;
}
</style>
</head>
<body>
<canvas id=“canvas”></canvas>

<script>
  // 获取 canvas 和 绘图上下文对象
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  let width, height;
  
  // 根据窗口尺寸调整canvas
  function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // 粒子参数设置
  const particleCount = 120;  // 粒子数量
  const maxDistance = 100;    // 连线的最大距离
  const particles = [];

  // 定义粒子类
  function Particle() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    // 随机生成运动方向和速度
    const angle = Math.random() * 2 * Math.PI;
    this.vx = Math.cos(angle) * (Math.random() * 0.5 + 0.5);
    this.vy = Math.sin(angle) * (Math.random() * 0.5 + 0.5);
    this.radius = 2;
  }

  // 更新粒子位置，并在边缘反弹
  Particle.prototype.update = function () {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > width) {
      this.vx = -this.vx;
    }
    if (this.y < 0 || this.y > height) {
      this.vy = -this.vy;
    }
  };

  // 绘制粒子（一个小圆点）
  Particle.prototype.draw = function () {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
  };

  // 创建所有粒子
  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle());
  }

  // 记录鼠标位置
  const mouse = { x: null, y: null };
  window.addEventListener("mousemove", function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  // 动画循环函数
  function animate() {
    // 清空画布
    ctx.clearRect(0, 0, width, height);

    // 遍历粒子数组进行更新和绘制
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.update();
      p.draw();

      // 在粒子间绘制连线
      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const dx = p.x - p2.x;
        const dy = p.y - p2.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < maxDistance) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = "rgba(255, 255, 255," + (1 - distance / maxDistance) + ")";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      // 如果鼠标在画布内，则与粒子间绘制连线
      if (mouse.x && mouse.y) {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < maxDistance) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          // 将鼠标连线使用暖色调呈现
          ctx.strokeStyle = "rgba(255, 100, 100," + (1 - distance / maxDistance) + ")";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }

  // 启动动画
  animate();
</script>
</body>
</html>
