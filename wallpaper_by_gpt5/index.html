<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>互动炫酷桌面壁纸</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <meta name="description" content="HTML/CSS/JS 炫酷可互动桌面壁纸" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 多层视差背景 -->
  <div id="bg-gradient" class="layer"></div>
  <div id="bg-grid" class="layer"></div>
  <div id="bg-glow" class="layer"></div>

  <!-- 画布：粒子 / 连接 / 波纹 -->
  <canvas id="space"></canvas>
  <canvas id="ripple"></canvas>

  <!-- 置中信息区 -->
  <div id="center-info">
    <div class="time" id="clock">--:--:--</div>
    <div class="date" id="date">----</div>
    <div class="quote" id="quote"></div>
  </div>

  <!-- 控制面板触发器 -->
  <button id="gear" title="设置 / Themes" aria-label="设置">⚙</button>

  <!-- 控制面板 -->
  <div id="panel" aria-hidden="true">
    <h2>主题 Themes</h2>
    <div id="themes" class="theme-list"></div>

    <h2>特效 Effects</h2>
    <label class="opt"><input type="checkbox" id="toggleNetwork" checked> 粒子网络</label>
    <label class="opt"><input type="checkbox" id="toggleGlow" checked> 背景辉光</label>
    <label class="opt"><input type="checkbox" id="toggleQuote" checked> 随机短句</label>
    <label class="opt"><input type="checkbox" id="toggleTimeCycle" checked> 基于时间自动渐变</label>

    <h2>性能 Performance</h2>
    <label class="opt">粒子数量 <input id="particleDensity" type="range" min="20" max="400" value="160" /></label>
    <label class="opt">连线距离 <input id="linkDistance" type="range" min="40" max="300" value="160" /></label>

    <button id="saveConfig" class="primary">保存配置</button>
    <button id="resetConfig">重置</button>
    <div class="hint">配置保存在 localStorage</div>
  </div>

  <!-- 浮动提示 -->
  <div id="fps" title="FPS / 粒子统计"></div>

  <script src="main.js"></script>
</body>
</html>
