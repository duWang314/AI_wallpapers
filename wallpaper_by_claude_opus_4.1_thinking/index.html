<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷交互式桌面壁纸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 渐变背景层 -->
    <div class="gradient-bg"></div>
    
    <!-- 粒子画布 -->
    <canvas id="particleCanvas"></canvas>
    
    <!-- 主容器 -->
    <div class="container">
        <!-- 时钟显示 -->
        <div class="clock-container">
            <div class="digital-clock">
                <span id="hours">00</span>
                <span class="separator">:</span>
                <span id="minutes">00</span>
                <span class="separator">:</span>
                <span id="seconds">00</span>
            </div>
            <div class="date" id="date">2025年1月1日 星期一</div>
        </div>
        
        <!-- 欢迎文字 -->
        <div class="welcome-text">
            <h1 class="glitch" data-text="CYBER SPACE">CYBER SPACE</h1>
            <p class="subtitle">Interactive Desktop Experience</p>
        </div>
        
        <!-- 交互提示 -->
        <div class="hint">
            <p>移动鼠标探索 · 点击创造涟漪 · 按空格键切换主题</p>
        </div>
    </div>
    
    <!-- 鼠标跟随光标 -->
    <div class="cursor-follower"></div>
    <div class="cursor-dot"></div>
    
    <!-- 涟漪效果容器 -->
    <div id="rippleContainer"></div>
    
    <script src="script.js"></script>
</body>
</html>
